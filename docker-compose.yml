services:
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - TZ=Asia/Seoul
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-administrator}
      - DB_PASSWORD=${DB_PASSWORD:-qwer!@34}
      - DB_NAME=${DB_NAME:-rcs_db}
      - WCS_URL=${WCS_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./BackEnd/static:/app/static
      - /home/administrator:/home/administrator
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ping')"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
